# Sentinel severity thresholds. Every value here is a DRAFT: tune freely.
# Spec: docs/severity-pipeline.md. Loaded and checked by severity_config.py,
# so a retune needs no code change; `python -m pytest` catches a broken file.
#
# Levels (one shared scale for every desk item):
#   1 Minor · 2 Elevated · 3 High · 4 Severe

[watching]
# The watching list (watch.py, desk_watch). A subject (an open item, or a
# fire state below Level 2) is "watching" when its key figure is within
# this fraction of the next level's threshold (0.05 = within 5%)...
margin = 0.05
# ...or has risen for this many consecutive source updates toward it.
# Counts new source data, not pipeline runs: FIRMS publishes about twice a
# day, so its 02:30 IST run usually repeats the 20:30 IST data, and fire
# levels use complete days, so fire subjects move once a day.
rising_updates = 3
# Rising only counts from this fraction of the threshold up, so a state
# going from 2 to 5 fire events (threshold 25) is not "watching".
# Not in the spec; first guess.
rising_min_progress = 0.5
# desk_watch rows not updated for this many days are deleted.
keep_days = 14

[quake]
# USGS magnitude at which each level starts. Below level 2 = Level 1.
level_2_min_magnitude = 5.0
level_3_min_magnitude = 6.0
level_4_min_magnitude = 7.0
# Scope: quakes within this distance of India's boundary...
india_buffer_km = 100
# ...plus quakes at or above this magnitude anywhere in the USGS search box.
# "India" is data/india_outline.geojson (India's official boundary).
anywhere_min_magnitude = 6.0

[quake.lifecycle]
# Any in-scope quake opens an item; it closes this many hours after the quake.
open_min_level = 1
close_after_hours = 48

[gdacs]
# Floods and cyclones: alert colour of GDACS's current episode -> level.
# "Green + rising": a Green event whose episode alert score went up when
# GDACS published its latest episode.
green = 1
green_rising = 2
orange = 3
red = 4

[gdacs.lifecycle]
# Items close when GDACS marks the event finished (iscurrent = false) or
# stops listing it; if the GDACS fetch fails they stay open as last-known.
open_min_level = 1

[air]
# National air-quality item (air.py). Primary source: CPCB's real-time AQI
# on data.gov.in ([air.datagov], [air.aqi]). Fallback: CPCB National AQI
# breakpoints applied to 24 h means of OpenAQ hourly data, marked
# approximate (the rest of this section). Either way a city's value is the
# mean over its stations, and the reason says which source set the level.
# Spec: poor -> 1, very poor -> 2, severe in N cities -> 3 or 4.
level_3_min_severe_cities = 1
level_4_min_severe_cities = 3
# The data is unvalidated, so a city counts as Severe toward Level 3/4 only
# once it has been Severe in this many consecutive assessments; until then
# it counts as Very poor (Job, 21 Oct 2026). Very poor and below count at
# once. Runs whose air assessment failed don't count either way.
severe_confirm_runs = 2
# Reference-grade monitors only; low-cost sensors (AirGradient, Clarity)
# read high in humid air. Add them here to trade accuracy for freshness.
providers = ["CPCB", "AirNow"]
# Ignore sensors whose newest reading is older than this (CPCB data lands
# on OpenAQ 2-3 days late).
max_data_age_hours = 96
# Freshness for the level: only stations whose 24 h window ends within this
# many hours count toward city bands; older ones stay in figures, flagged
# stale. With fewer than min_fresh_cities fresh cities there is no new
# level: air:IN stays last-known and its reason says so. CPCB data reaches
# OpenAQ ~2.5 days late, so 36 h left only 2 fresh cities (Oct 2026).
fresh_within_hours = 72
min_fresh_cities = 10
# A station's 24 h mean needs at least this many hourly values (CPCB: 16 of 24).
min_hours_for_mean = 16
# Only cities with a station whose latest value is at least this fraction
# of the "poor" threshold get their 24 h history fetched (one request per
# sensor, worst cities first, at most max_history_requests per run).
prefilter_fraction = 0.5
max_history_requests = 150
# Big cities: sample this many stations per pollutant, spread from cleanest
# to dirtiest, so Delhi's 39 stations don't use the whole request budget.
max_stations_per_city = 8
# Station names CPCB counts as the same city.
city_aliases = { "New Delhi" = "Delhi" }

[air.datagov]
# CPCB's real-time AQI feed (datagov.py): CPCB's own AQI sub-index per
# station and pollutant, from 24 h averages (8 h for CO and ozone),
# refreshed hourly, unvalidated. The OpenAQ assessment is used instead when
# the feed fails, has fewer than min_fresh_cities cities with an AQI, or its
# snapshot is older than this:
max_snapshot_age_hours = 6
# CPCB method: a station's AQI is its highest sub-index, computed only with
# at least this many pollutants, one of them PM2.5 or PM10. A city's AQI is
# the mean of its stations' AQIs, as in CPCB's daily bulletin.
min_pollutants = 3

[air.aqi]
# CPCB AQI categories: a band starts above this AQI (201-300 Poor,
# 301-400 Very poor, 401-500 Severe), the index-scale twin of the
# [air.pm25] / [air.pm10] breakpoints.
poor_above = 200
very_poor_above = 300
severe_above = 400

[air.pm25]
# µg/m³, 24 h mean (OpenAQ fallback). A band starts above this value.
poor_above = 90
very_poor_above = 120
severe_above = 250

[air.pm10]
poor_above = 250
very_poor_above = 350
severe_above = 430

[air.lifecycle]
# Opens when any city is Poor or worse; closes when none is (on a good
# assessment). If both sources fail it stays open as last-known.
open_min_level = 1

[fire]
# Hotspot filter and clustering.
confidence = ["n", "h"]  # VIIRS confidence: l(ow), n(ominal), h(igh)
cluster_km = 1.5         # hotspots this close (same UTC day) join one fire event
# fire_events keeps this many days; older days are deleted (the events
# table still has 60 days of hotspots to rebuild from).
events_retention_days = 14
# Districts left out of fire roll-ups entirely (no fire_events rows). They
# stay in India's outline for the quake scope.
#   76128533B2782141712775 = "Gilgit-Baltistan / PoK": Pakistan-administered,
#   inside India's official boundary, filed under Ladakh in the source.
excluded_district_ids = ["76128533B2782141712775"]
# One desk item per state (fire_desk.py), levelled on the last complete UTC
# day (yesterday): its fire events over the state's seasonal norm (mean
# daily fire events for that calendar week, 2024-2025 baseline). Today's
# events so far are shown as a partial count only; they never set the level.
# Ratio below level_2 = Level 1 ("at norm").
# A single day's count is bursty (cloud, satellite swath): with the spec's
# 1.25x / 2x and a minimum of 10, a replay of 2024-2025 kept ~6 fire items
# open on an average day. 2x / 4x with a minimum of 25 keeps ~1.8 (Job,
# 21 Oct 2026). Test changes with tools/replay_fire_levels.py.
level_2_min_ratio = 2.0
level_3_min_ratio = 4.0
# The ratio only counts once the state has at least this many fire events;
# below it the state stays Level 1 however high the ratio. Stops a state
# that averages 0.3 fires/day reading 10x norm on a 3-fire day.
min_fire_events = 25
# Level 3 "forest fire": an active GDACS wildfire alert in the state.
gdacs_wildfire_level = 3
# Level 4: a fire event with max FRP at or above this, within level_4_near_km
# of a place with at least level_4_min_population people
# (data/india_places.csv, GeoNames). Not in the spec; first guesses.
level_4_min_frp_mw = 100
level_4_near_km = 10
level_4_min_population = 100000
# Levels derived from FIRMS (ratio to norm, large fire near people) are
# capped at this level until live (NRT) fire counts are compared with the
# archive (SP) the norm comes from: see "Live vs archive fire counts" in the
# spec's follow-ups. The reason says when the cap lowers a level. A current
# GDACS wildfire alert can still lift an item to gdacs_wildfire_level.
# 4 = no cap.
calibration_cap = 2

[fire.static_mask]
# Hotspots in a static heat-source cell (steel plants, refineries, gas
# flares), or within this many cells of one, are dropped before clustering.
# Mask file: data/static_heat_cells.json (tools/build_fire_baseline.py).
neighbour_cells = 1
# Build: FIRMS archive detections of these types mark a cell static:
# 1 volcano (Barren Island), 2 other static land source (industry, gas
# flares, coal-seam fires), 3 offshore (platforms). The live NRT feed has
# no type column, hence the mask.
mask_types = [1, 2, 3]
cell_deg = 0.004       # ~450 m cells
min_detections = 2     # static detections a cell needs over the archive years

[fire.baseline]
# Seasonal norm: mean daily fire events per state per calendar week, from
# the VIIRS NOAA-20 SP archive, counted exactly like live fire_events.
# Week = (day of year - 1) // 7 + 1, days 358-366 fold into week 52.
years = [2024, 2025]
smooth_weeks = 1       # norm for week w averages weeks w-1 .. w+1

[fire.lifecycle]
# Spec: opens at level 2+, escalates on any level increase, closes after
# this many hours at Level 1 or with no detections. Hours of data, counted
# in whole complete days: 48 = two days in a row below open_min_level.
open_min_level = 2
close_after_hours = 48
